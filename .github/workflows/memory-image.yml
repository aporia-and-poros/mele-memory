# 有改动、或者手动点，就打 x86 + arm 两种镜像推到 GHCR（Mele Host 的 `mele-host memory on` 拉这个）
name: memory-image
on:
  push:
    branches: [main]
    paths: ["memory/**", "mcp_server/**", "tide/**", "web/**", "pyproject.toml", "Dockerfile", ".github/workflows/memory-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/aporia-and-poros/mele-memory:latest
            ghcr.io/aporia-and-poros/mele-memory:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
